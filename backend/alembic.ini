# Only for `alembic revision` (`just migration`). Migrations run with `python -m debatemeet.migrate`,
# which checks the database first (docs/architecture.md, section 10).
[alembic]
script_location = debatemeet:migrations
# Ids are sequential, given with --rev-id; the prefix keeps the file name a valid module name.
file_template = r%%(rev)s_%%(slug)s
