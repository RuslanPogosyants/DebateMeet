# Checks on every PR and on main (docs/architecture.md §10). Each area is a job that runs only
# when its files change; `ci-ok` is the one summary check a merge waits for.

name: CI

on:
  pull_request:
    # `edited` re-checks a renamed PR: its title becomes the squash commit message.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contract: ${{ steps.filter.outputs.contract }}
      frontend: ${{ steps.filter.outputs.frontend }}
      images: ${{ steps.filter.outputs.images }}
      media: ${{ steps.filter.outputs.media }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        name: Filter paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          everything() {
            printf '%s\n' backend=true contract=true frontend=true images=true media=true >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A push to main checks everything.
          [ "$EVENT" = pull_request ] || everything
          # On a PR, HEAD is the merge commit and its first parent is the tip of the base branch.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          # Workflows, lock files and the contract run everything.
          if grep -qE '^(\.github/|frontend/pnpm-lock\.yaml$|backend/uv\.lock$|backend/src/debatemeet/(.+/)?contract/)' <<< "$changed"; then
            everything
          fi
          area() { # name, extended regex of its paths
            if grep -qE "$2" <<< "$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          area backend '^backend/'
          area frontend '^frontend/'
          # The contract is the backend API and its generated TS types.
          area contract '^(backend/|frontend/src/contract/|frontend/package\.json$)'
          # Tests against the LiveKit of compose.yaml.
          area media '^(backend/|compose\.yaml$|deploy/dev/)'
          # The backend, web and deploy bundle images.
          area images '^(backend/|frontend/|deploy/server/|tools/app-version\.sh$)'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The tests' own database; locally it is debatemeet_test in compose.yaml.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.6
        env:
          POSTGRES_USER: debatemeet
          POSTGRES_PASSWORD: debatemeet
          POSTGRES_DB: debatemeet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debatemeet -d debatemeet_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DM_TEST_DATABASE_URL: postgresql+asyncpg://debatemeet:debatemeet@localhost:5432/debatemeet_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.25
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Python 3.14 comes from backend/.python-version; uv downloads it.
      - id: install
        run: uv sync --locked
      # Every check runs once dependencies are in, so one push reports all failures at once.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff check --output-format=github
      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff format --check
      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync mypy
      - name: import-linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync lint-imports
      # Tests against LiveKit run in the media job.
      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync pytest -m "not livekit"

  media:
    name: Media
    needs: changes
    if: needs.changes.outputs.media == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # compose.yaml rather than a service container: services start before the checkout and
      # cannot see deploy/dev/livekit.yaml (docs/architecture.md, section 9).
      - name: Start LiveKit
        run: docker compose up -d livekit
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.25
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      # The tests serve the webhook endpoint on port 8000, where LiveKit sends its webhooks.
      - name: pytest (LiveKit)
        run: uv run --no-sync pytest -m livekit
      - name: LiveKit logs
        if: failure()
        run: docker compose logs livekit

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - id: install
        run: pnpm install --frozen-lockfile
      # Every check runs once dependencies are in, so one push reports all failures at once.
      - name: oxlint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - name: tsc
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: dependency-cruiser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm depcruise
      - id: build
        name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vite build
      - name: Initial JS budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm budget

  contract:
    name: Contract
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.25
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Install
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && pnpm install --frozen-lockfile)
      # The two commands of `just contract`.
      - name: Generate
        run: |
          (cd backend && uv run --no-sync python -m debatemeet.openapi ../frontend/src/contract/openapi.json)
          (cd frontend && pnpm contract)
      - name: Generated contract is committed
        run: |
          if [ -n "$(git status --porcelain -- frontend/src/contract)" ]; then
            git status --short -- frontend/src/contract
            git diff -- frontend/src/contract
            echo '::error::frontend/src/contract is stale: run `just contract` and commit the result'
            exit 1
          fi
      # Open tabs keep the old contract (docs/architecture.md, section 8): a warning, not a failure.
      - name: Incompatible changes
        if: github.event_name == 'pull_request'
        run: |
          spec=frontend/src/contract/openapi.json
          if ! git cat-file -e "HEAD^1:$spec" 2> /dev/null; then
            echo "The base branch has no $spec yet: nothing to compare with."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/specs"
          git show "HEAD^1:$spec" > "$RUNNER_TEMP/specs/base.json"
          cp "$spec" "$RUNNER_TEMP/specs/head.json"
          docker run --rm -v "$RUNNER_TEMP/specs:/specs:ro" \
            tufin/oasdiff@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac \
            breaking /specs/base.json /specs/head.json --format githubactions \
            | sed -e 's/^::error /::warning /' -e "s#file=/specs/head.json#file=$spec#"

  # The images of docs/architecture.md §10, built without a push while there is no registry,
  # and each one checked for doing its job.
  images:
    name: Images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The database the backend image starts against.
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873 # 18.6
        env:
          POSTGRES_USER: debatemeet
          POSTGRES_PASSWORD: debatemeet
          POSTGRES_DB: debatemeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debatemeet -d debatemeet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: hadolint
        run: |
          for dockerfile in backend/Dockerfile frontend/Dockerfile deploy/server/Dockerfile; do
            echo "$dockerfile"
            docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < "$dockerfile" # v2.14.0
          done
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            tools/app-version.sh deploy/server/livekit.sh # v0.11.0
      # Every image is built and checked even when a linter fails, so one push reports all failures.
      - id: version
        name: Version
        if: ${{ !cancelled() }}
        run: echo "version=$(tools/app-version.sh)" >> "$GITHUB_OUTPUT"
      - id: buildx
        if: ${{ !cancelled() }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: backend
        name: Build backend
        if: ${{ !cancelled() && steps.buildx.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: debatemeet-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - id: web
        name: Build web
        if: ${{ !cancelled() && steps.buildx.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: debatemeet-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - id: bundle
        name: Build bundle
        if: ${{ !cancelled() && steps.buildx.outcome == 'success' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/server
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: debatemeet-bundle:ci
          load: true
      # Starts against Postgres, turns healthy, reports the version it was built with, not as root.
      - name: Backend image
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name backend --network host \
            -e DM_DATABASE_URL=postgresql+asyncpg://debatemeet:debatemeet@127.0.0.1:5432/debatemeet \
            -e DM_LIVEKIT_API_KEY=ci -e DM_LIVEKIT_API_SECRET=ci-secret-of-the-images-job-0000000000 \
            debatemeet-backend:ci
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' backend)" = healthy ] && break
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' backend)" != healthy ]; then
            docker logs backend
            echo '::error::the backend image did not turn healthy'
            exit 1
          fi
          health="$(curl -fsS http://127.0.0.1:8000/api/health)"
          echo "$health"
          test "$(jq -r .version <<< "$health")" = "$VERSION"
          test "$(docker exec backend id -u)" != 0
      # The command the deploy agent runs in a one-off container, twice: the second run is a no-op.
      - name: Migrations in the backend image
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: |
          for _ in 1 2; do
            docker run --rm --network host \
              -e DM_DATABASE_URL=postgresql+asyncpg://debatemeet:debatemeet@127.0.0.1:5432/debatemeet \
              -e DM_LIVEKIT_API_KEY=ci -e DM_LIVEKIT_API_SECRET=ci-secret-of-the-images-job-0000000000 \
              debatemeet-backend:ci python -m debatemeet.migrate
          done
      # Holds index.html and every file it asks for.
      - name: Web image
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        run: |
          id="$(docker create debatemeet-web:ci none)"
          docker cp "$id:/web" "$RUNNER_TEMP/web"
          docker rm "$id"
          test -f "$RUNNER_TEMP/web/index.html"
          grep -oE '/assets/[^"]+' "$RUNNER_TEMP/web/index.html" | while read -r asset; do
            test -f "$RUNNER_TEMP/web$asset" || { echo "::error::index.html asks for $asset, the image lacks it"; exit 1; }
          done
      # Compose, Caddy and LiveKit accept the bundle as a server would, with the values of env.example.
      - name: Bundle image
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          DM_BACKEND_IMAGE: debatemeet-backend:ci
          DM_POSTGRES_PASSWORD: ci
          DM_LIVEKIT_API_KEY: APIci
          DM_LIVEKIT_API_SECRET: ci-secret-of-the-images-job-0000000000
          DM_ACME_EMAIL: admin@example.ru
          DM_APP_DOMAIN: stage.example.ru
          DM_LIVEKIT_DOMAIN: livekit.stage.example.ru
          DM_TURN_DOMAIN: turn.stage.example.ru
        run: |
          id="$(docker create debatemeet-bundle:ci none)"
          docker cp "$id:/bundle" "$RUNNER_TEMP/bundle"
          docker rm "$id"
          cd "$RUNNER_TEMP/bundle"
          docker compose --env-file env.example config --quiet
          docker run --rm -e DM_ACME_EMAIL -e DM_APP_DOMAIN -e DM_LIVEKIT_DOMAIN -e DM_TURN_DOMAIN \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            livekit/caddyl4@sha256:9dd090159a6042a907dbff0ce9dda27a21d2a559dc7b03b60a8e6b1b60b8348e \
            adapt --config /etc/caddy/Caddyfile --validate > /dev/null # v2.11.3
          ports="$(docker run --rm -e LIVEKIT_KEYS="$DM_LIVEKIT_API_KEY: $DM_LIVEKIT_API_SECRET" \
            -v "$PWD/livekit.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3 \
            --config /etc/livekit.yaml ports 2>&1)" # v1.13.7
          echo "$ports"
          # `ports` exits 0 even when it cannot parse the config, so its output is what counts.
          grep -q '^TCP Ports' <<< "$ports"

  # Hygiene and CodeQL run on every PR in full: they are cheap, and code scanning compares the
  # analysis of each language with the base branch.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.25
          enable-cache: false
      # The commit-msg rules of lefthook.yml; the hook never sees the squash commit.
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/git/check_message.py --title "$TITLE"
      - name: Git tools tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/git
      # The token lets zizmor check pinned SHAs and known advisories against GitHub.
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.30.1 --format=github .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, contract, frontend, images, media, hygiene, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A skipped job is fine: its area did not change. A failed path filter is not.
      - name: Every job passed or was skipped
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo 'All checks passed.'
