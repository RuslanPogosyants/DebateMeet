# Local dev infrastructure: Postgres and LiveKit. Backend and frontend run natively.
# Production deployment lives in deploy/ and is not this file.
name: debatemeet

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: debatemeet
      POSTGRES_PASSWORD: debatemeet
      POSTGRES_DB: debatemeet
    ports:
      - "127.0.0.1:${DM_PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/dev/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debatemeet -d debatemeet"]
      interval: 2s
      timeout: 3s
      retries: 15

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./deploy/dev/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres-data:
