# The deploy agent and its tests: stdlib Python 3.9+ on the system interpreter of the server.
line-length = 100
target-version = "py39"

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "SIM", "RUF"]

[lint.per-file-ignores]
# Running docker is what the agent is for.
"agent.py" = ["S603", "S607"]
"tests/**" = ["S101"]
