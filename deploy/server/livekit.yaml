# LiveKit on the stand and in prod (docs/architecture.md §6). It runs in the host network.
# No keys or per-server values here: they come from .env (env.example) through compose.yaml —
# LIVEKIT_KEYS, NODE_IP, LIVEKIT_WEBHOOK_API_KEY and LIVEKIT_TURN_DOMAIN.
port: 7880
# The API, the signal WebSocket and Prometheus only on loopback: outside through Caddy.
# ICE/TCP 7881 and UDP 7882 listen on every interface, as they must; so does the TURN port 5349,
# which LiveKit cannot narrow: the firewall keeps it closed and Caddy reaches it on 127.0.0.1.
bind_addresses: [127.0.0.1]
rtc:
  tcp_port: 7881
  udp_port: 7882
  # The node IP is given (NODE_IP): otherwise LiveKit asks a public STUN server, abroad by default.
  use_external_ip: false
room:
  # Only the backend creates media rooms: a client with an old token must not make one of its own.
  auto_create: false
  max_participants: 30
limit:
  subscription_limit_video: 12
webhook:
  urls:
    # The backend in the host network, past Caddy and TLS.
    - http://127.0.0.1:8000/internal/livekit/webhook
  resource_url_notifier:
    # How long an event may wait in the queue before it is sent; the default is 30 s.
    max_age: 5m
turn:
  enabled: true
  # TURN/TLS on 443: Caddy picks the TURN domain by SNI, terminates TLS and passes TCP here.
  tls_port: 5349
  external_tls: true
  # No TURN/UDP: its port is not open, UDP media go through 7882.
  udp_port: 0
prometheus:
  port: 6789
logging:
  level: info
